<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>看板</title>
<script>
// 主题同步：尽早执行，避免白闪；同步宿主 data-mode / prefers-color-scheme / postMessage / papr-theme-change
(function(){
  function apply(mode){
    if(mode!=='dark' && mode!=='light') mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-mode', mode);
    try{ document.documentElement.style.colorScheme = mode; }catch{}
  }
  function detect(){
    try{
      var p = window.parent;
      if(p && p!==window){
        var pd = p.document;
        var m = pd.documentElement.getAttribute('data-mode') || pd.documentElement.getAttribute('data-theme') || pd.body?.getAttribute('data-mode');
        if(m==='dark'||m==='light') return m;
        if(pd.documentElement.classList.contains('dark') || pd.body?.classList.contains('dark')) return 'dark';
        if(pd.documentElement.classList.contains('light')) return 'light';
      }
    }catch(e){}
    var own = document.documentElement.getAttribute('data-mode');
    if(own==='dark'||own==='light') return own;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  apply(detect());
  try{
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onMq = function(e){ 
      try{
        var p = window.parent;
        if(p && p!==window){
          var m = p.document.documentElement.getAttribute('data-mode');
          if(m==='dark'||m==='light') return;
        }
      }catch(e2){}
      apply(e.matches?'dark':'light'); 
    };
    mq.addEventListener ? mq.addEventListener('change', onMq) : mq.addListener(onMq);
  }catch(e){}
  try{
    var p = window.parent;
    if(p && p!==window){
      var target = p.document.documentElement;
      var obs = new MutationObserver(function(){ apply(detect()); });
      obs.observe(target, {attributes:true, attributeFilter:['data-mode','data-theme','class']});
      if(p.document.body) obs.observe(p.document.body, {attributes:true, attributeFilter:['class','data-mode']});
    }
  }catch(e){}
  window.addEventListener('message', function(e){
    var d=e.data;
    if(!d) return;
    var mode = d.mode || d.theme || d['data-mode'] || (d.type==='theme' && d.value);
    if(mode==='dark'||mode==='light') apply(mode);
    if(typeof d==='string' && (d==='dark'||d==='light')) apply(d);
  });
  window.addEventListener('papr-theme-change', function(e){
    var m = e && e.detail && e.detail.mode;
    if(m==='dark'||m==='light') apply(m);
  });
  var last = document.documentElement.getAttribute('data-mode');
  setInterval(function(){
    var cur = detect();
    if(cur!==last){ last=cur; apply(cur); }
  }, 1000);
  window.__applyTheme = apply;
  window.__detectTheme = detect;
})();
</script>
<link rel="stylesheet" href="css/theme.css" />
<style>
  :root{ --bg:#f7f4ef; --panel:#fdfcfa; --line:#e8ddd0; --fg:#1e1b18; --muted:#7a7570; --accent:#1e1b18; --accent-fg:#fdfcfa; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0a0a0c; --panel:#17171a; --line:#232326; --fg:#f4f4f5; --muted:#9a9aa3; --accent:#ffffff; --accent-fg:#0a0a0c; }
  }
  html[data-mode="light"]{ --bg:#f7f4ef; --panel:#fdfcfa; --line:#e8ddd0; --fg:#1e1b18; --muted:#7a7570; --accent:#1e1b18; --accent-fg:#fdfcfa; }
  html[data-mode="dark"]{ --bg:#0a0a0c; --panel:#17171a; --line:#232326; --fg:#f4f4f5; --muted:#9a9aa3; --accent:#ffffff; --accent-fg:#0a0a0c; }
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:var(--bg);color:var(--fg)}
  #root{min-height:100vh}
  #boot{max-width:560px;margin:40px auto;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--fg)}
  #boot h2{margin:0 0 6px;font-size:15px;color:var(--fg)}
  #boot p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
  #boot code{font-size:11px;background:var(--panel);border:1px solid var(--line);padding:1px 5px;border-radius:6px;color:var(--fg)}
  #err{position:fixed;left:12px;right:12px;bottom:12px;background:var(--accent);color:var(--accent-fg);padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.5;display:none;z-index:99;white-space:pre-wrap;word-break:break-all;border:1px solid var(--line)}
  #err.show{display:block}
</style>
<script>
  window.__bootErrors=[];
  window.addEventListener('error', function(e){
    var msg = (e.message||'error') + (e.filename? ' @ '+e.filename+':'+e.lineno:'');
    window.__bootErrors.push(msg);
    var el=document.getElementById('err');
    if(el){ el.textContent='⚠ '+msg+'\n'+window.__bootErrors.slice(-3).join('\n'); el.className='show'; }
  });
  window.addEventListener('unhandledrejection', function(e){
    var msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason||'promise rejection');
    window.__bootErrors.push(msg);
    var el=document.getElementById('err');
    if(el){ el.textContent='⚠ '+msg; el.className='show'; }
  });
</script>
</head>
<body>
<div id="root"><div id="boot"><h2>▦ 看板 加载中…</h2><p>正在连接本地 SQLite 存储…</p></div></div>
<div id="err"></div>
<script src="js/projectScope.js"></script>
<script src="js/main.js"></script>
</body>
</html>
