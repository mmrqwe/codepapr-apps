<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>学习导师</title>
<script>
(function () {
  var root = document.documentElement;
  function apply(v) { if (v === "dark" || v === "light") root.setAttribute("data-mode", v); }
  function pick(d) {
    if (d == null) return "";
    if (typeof d === "string") return d;
    var v = d.theme || d.themeMode || d.mode || d.colorScheme || d.value;
    if (v == null && d.payload) return pick(d.payload);
    if (v == null && d.data) return pick(d.data);
    return v == null ? "" : String(v);
  }
  var mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
  if (!root.hasAttribute("data-mode") && mq) apply(mq.matches ? "dark" : "light");
  window.addEventListener("message", function (e) {
    try {
      var t = pick(e.data).toLowerCase();
      if (/dark/i.test(t)) apply("dark");
      else if (/light/i.test(t)) apply("light");
    } catch (err) {}
  });
  var mo = new MutationObserver(function () {
    var cls = root.className || "";
    var kind = root.getAttribute("data-vscode-theme-kind") || "";
    if (/vscode-dark|theme-dark/i.test(cls) || /dark/i.test(kind)) apply("dark");
    else if (/vscode-light|theme-light/i.test(cls) || /light/i.test(kind)) apply("light");
  });
  mo.observe(root, { attributes: true });
  var modeMo = new MutationObserver(function () {});
  modeMo.observe(root, { attributes: true, attributeFilter: ["data-mode"] });
})();
</script>
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">🎓 <span data-i18n="brandName">学习导师</span> <span class="sub" data-i18n="brandSub">多学科 · 零起点 · 普林斯顿读本式讲解</span></div>
    <nav id="domain-tabs">
      <select id="domain-select" class="domain-select" data-i18n-title="selectDomain" title="选择学科"></select>
    </nav>
    <button class="icon-btn" id="settings-btn" data-i18n-title="settingsBtnTitle" title="学习目标设置">⚙️</button>
  </header>
  <div id="layout">
    <aside id="sidebar">
      <button class="nav-btn" data-view="home">🏠 <span data-i18n="navHome">主页</span></button>
      <button class="nav-btn" data-view="dashboard">📊 <span data-i18n="navDashboard">学科总览</span></button>
      <button class="nav-btn" data-view="intro">📚 <span data-i18n="navIntro">领域导览</span></button>
      <button class="nav-btn" data-view="path">🗺️ <span data-i18n="navPath">学习路径</span></button>
      <button class="nav-btn" data-view="wrong">📕 <span data-i18n="navWrong">错题本</span></button>
      <button class="nav-btn" data-view="review">🔁 <span data-i18n="navReview">复习</span><span class="nav-badge" id="review-badge" style="display:none">0</span></button>
      <button class="nav-btn" data-view="records">📜 <span data-i18n="navRecords">学习记录</span></button>
      <button class="nav-btn" data-view="custom">🎨 <span data-i18n="navCustom">专题</span></button>
    </aside>
    <main id="main"></main>
  </div>
</div>
<div id="toast"></div>
<div id="modal-root"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
